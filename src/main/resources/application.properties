
spring.application.name=backend-web

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_colorin}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Seguridad - Semana 14
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.error.include-message=never
server.error.include-stacktrace=never

# Monitoreo - Semana 16
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.file.name=${LOG_DIR:logs}/backend-web.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
logging.level.pe.ferreteria=INFO
